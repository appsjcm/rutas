<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rutas · Comprobaciones</title>
<!--
 Las mismas pruebas que `node --test tests/*.cjs`, corriendo en el navegador.
 No duplica ni un caso: lee los .cjs tal cual y les da un `require` que devuelve los
 modulos ya cargados y un `node:assert/strict` compatible. Asi la suite se puede pasar
 desde el movil, sin node instalado y sin instalar nada.
-->
<style>
:root{
 --fondo:#f4f7fa; --papel:#fff; --tinta:#172b43; --suave:#607389;
 --regla:#e1e8f0; --regla-fuerte:#bdcad8; --acento:#096c83;
 --bien:#0a7d5a; --mal:#b3261e; --bien-fondo:#e6f5ee; --mal-fondo:#fdecea;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
 --fondo:#0e1620; --papel:#16212e; --tinta:#e8eef5; --suave:#93a5b8;
 --regla:#243344; --regla-fuerte:#33465c; --acento:#4bc0d9;
 --bien:#5ddca9; --mal:#ff8a80; --bien-fondo:#10321f; --mal-fondo:#3a1614;
}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--fondo);color:var(--tinta);
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;
 padding-bottom:calc(16px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{margin:0 0 14px;color:var(--suave);font-size:13px}
#barra{position:sticky;top:0;z-index:2;background:var(--papel);
 border:1px solid var(--regla-fuerte);border-radius:12px;padding:12px 14px;margin-bottom:12px}
#titular{font-size:17px;font-weight:700;margin:0}
#titular[data-tono=ok]{color:var(--bien)} #titular[data-tono=mal]{color:var(--mal)}
#detalle{margin:3px 0 0;color:var(--suave);font-size:12.5px}
#progreso{height:6px;border-radius:99px;background:var(--regla);margin-top:10px;overflow:hidden}
#progreso i{display:block;height:100%;width:0;background:var(--acento);transition:width .12s linear}
.acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{min-height:44px;padding:8px 14px;border-radius:10px;cursor:pointer;
 border:1px solid var(--regla-fuerte);background:var(--papel);color:var(--tinta);
 font-family:inherit;font-size:13px;font-weight:650}
button:hover{border-color:var(--acento)}
button:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
button[disabled]{opacity:.5;cursor:default}
ul{list-style:none;margin:0;padding:0}
.fichero{border:1px solid var(--regla);border-radius:10px;background:var(--papel);
 margin-bottom:8px;overflow:hidden}
.fichero>summary{cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:center;
 font-size:13.5px;font-weight:600;min-height:44px}
.fichero>summary::-webkit-details-marker{display:none}
.marca{width:20px;text-align:center;flex:0 0 20px;font-size:13px}
.ok .marca{color:var(--bien)} .mal .marca{color:var(--mal)}
.fichero.mal{border-color:var(--mal)}
.cuenta{margin-left:auto;color:var(--suave);font-weight:500;font-size:12px;
 font-variant-numeric:tabular-nums}
.caso{padding:7px 12px 7px 42px;border-top:1px solid var(--regla);font-size:12.5px}
.caso.pasa{color:var(--suave)}
.caso.falla{background:var(--mal-fondo);color:var(--tinta)}
.caso pre{margin:6px 0 0;padding:8px;background:var(--papel);border-radius:8px;
 border:1px solid var(--regla);overflow-x:auto;font-size:11.5px;line-height:1.4;
 white-space:pre-wrap;word-break:break-word}
.nota{margin:14px 0 0;color:var(--suave);font-size:12px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
</style>
<main>
<h1>Rutas · Comprobaciones</h1>
<p class="sub">Las mismas pruebas que <code>node --test tests/*.cjs</code>, sin node.</p>

<div id="barra">
 <p id="titular">Cargando módulos…</p>
 <p id="detalle">&nbsp;</p>
 <div id="progreso"><i></i></div>
 <div class="acciones">
  <button type="button" id="otra-vez" disabled>Pasar otra vez</button>
  <button type="button" id="solo-fallos" disabled>Ver solo los fallos</button>
  <button type="button" id="copiar" disabled>Copiar informe</button>
 </div>
</div>

<ul id="lista"></ul>
<p class="nota">Si un módulo no carga, sus pruebas aparecen como fallo en vez de desaparecer
en silencio: una suite que se salta lo que no puede probar no sirve de nada.</p>
</main>

<script src="assert-shim.js"></script>
<script src="runner.js"></script>
